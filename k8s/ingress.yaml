apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-trading
  namespace: agentic-trading
  labels:
    app.kubernetes.io/part-of: agentic-trading-platform
spec:
  rules:
    - host: frontend.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
