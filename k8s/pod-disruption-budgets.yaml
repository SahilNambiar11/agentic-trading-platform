apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: agentic-trading
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: agentic-trading-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: agentic-trading
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: agentic-trading-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/component: api
